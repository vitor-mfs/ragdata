[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdata"
version = "0.1.0"
description = "Auxiliar de build para Ragnarok Online Renewal (LATAM), usando Divine Pride e browiki"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ragdata = "ragdata.cli:app"
ragdata-mcp = "ragdata.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdata"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
